<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>مركز التحكم الشخصي</title>
    <style>
      html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f1ea;color:#273038}
      #boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      #boot-card{max-width:460px;background:#fffdf8;border:1px solid #ded7cc;border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(50,45,38,.08)}
      #boot-card h1{margin:0 0 10px;font-size:22px}
      #boot-card p{margin:0;color:#777;line-height:1.7;font-size:14px}
    </style>
    <script>
      if (location.pathname === '/myproject') {
        location.replace('/myproject/' + location.search + location.hash);
      }
      window.__appMounted = false;
      window.addEventListener('error', function (event) {
        var card = document.getElementById('boot-card');
        if (card && !window.__appMounted) {
          card.innerHTML = '<h1>تعذر تشغيل الواجهة</h1><p>صار خطأ بتحميل ملفات التطبيق. حدّث الصفحة تحديثاً كاملاً Ctrl + F5. إذا استمر الخطأ، أرسل لقطة من Console.</p>';
        }
      });
      window.addEventListener('unhandledrejection', function () {
        var card = document.getElementById('boot-card');
        if (card && !window.__appMounted) {
          card.innerHTML = '<h1>تعذر تشغيل الواجهة</h1><p>صار خطأ أثناء بدء التطبيق. جرّب Ctrl + F5.</p>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback"><div id="boot-card"><h1>جاري فتح النظام...</h1><p>إذا استمر التحميل، حدّث الصفحة من زر إعادة التحميل في المتصفح.</p></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(function () {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        var moduleScript = document.querySelector('script[type="module"][src]');
        var src = moduleScript && moduleScript.src;
        if (!src) {
          var card = document.getElementById('boot-card');
          if (card) card.innerHTML = '<h1>تعذر تحميل التطبيق</h1><p>لم يتم العثور على ملف تشغيل الواجهة.</p>';
          return;
        }

        var retries = Number(sessionStorage.getItem('app-asset-retry') || '0');
        if (retries < 2) {
          sessionStorage.setItem('app-asset-retry', String(retries + 1));
          var retry = document.createElement('script');
          retry.type = 'module';
          retry.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 'retry=' + Date.now();
          retry.onerror = function () {
            var card = document.getElementById('boot-card');
            if (card) card.innerHTML = '<h1>فشل تحميل التطبيق</h1><p>ملف التشغيل لم يصل من GitHub Pages. اضغط إعادة التحميل بعد ثوانٍ.</p>';
          };
          document.body.appendChild(retry);
        } else {
          var card = document.getElementById('boot-card');
          if (card) card.innerHTML = '<h1>فشل بدء التطبيق</h1><p>أغلق الصفحة وافتح رابط /myproject/ من جديد. إذا استمر الخطأ فالمشكلة من ملف التشغيل المنشور.</p>';
        }
      }, 3500);
    </script>
  </body>
</html>
